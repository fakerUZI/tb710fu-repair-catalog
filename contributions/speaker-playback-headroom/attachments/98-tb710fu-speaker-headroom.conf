# Give the Q6APM speaker two 480-frame periods of additional playback headroom.
# The existing polling mode and microphone rules still apply.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.pro-output-0" } ]
    actions = { update-props = { api.alsa.headroom = 960 } }
  }
]
